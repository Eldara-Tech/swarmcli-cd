# swarmcli-cd, deployed the way it is meant to run: on a manager node, reaching
# the swarm through the mounted socket.
#
#   # Start from examples/applications.yaml and edit it for your repositories.
#   docker config create swarmcli-cd-applications ./applications.yaml
#   printf '%s' "$(openssl rand -hex 32)" | docker secret create swarmcli-cd-token -
#   docker stack deploy -c stack.yml swarmcli-cd
#
# Both a config and a secret are immutable in Swarm, so changing either means
# creating a new one and updating this file. That is fine for the controller's
# own bootstrap — the admin token, the listen address, where the app set lives —
# which is what this file is and which rarely changes.
#
# The application set itself does not have to live here. Point the controller at
# a git repository or at a directory a sidecar keeps current and adding an
# application becomes a commit rather than a redeploy; see the two commented
# commands below and docs/configuration.md.

services:
  controller:
    # The default artefact: this repository plus licensed code that does nothing
    # until a licence verifies. For the wholly Apache-2.0 build, pin a version
    # with the -oss suffix — eldaratech/swarmcli-cd:1.2.0-oss — which is
    # deliberately not a moving tag. See docs/editions.md.
    image: eldaratech/swarmcli-cd:latest

    # Mode 1 (default) — the app set is the immutable Docker config mounted
    # below. Nothing changes without a redeploy, which is what an air-gapped or
    # tightly-controlled deployment wants.
    command: ["controller", "--config", "/etc/swarmcli-cd/applications.yaml"]

    # Mode 2 — the controller pulls the app set itself, with the same
    # SWARMCLI_CD_GIT_* credential it uses for the applications. A commit to
    # apps/applications.yaml adds, removes or retunes an application within
    # --appset-interval, with no redeploy. Drop the `configs:` block below when
    # using this. Whoever can commit to that repository defines every
    # application, destination and policy this controller applies with the
    # docker socket: protect it with branch protection and signed commits.
    # command: ["controller",
    #           "--appset-repo", "https://github.com/your-org/apps.git",
    #           "--appset-revision", "main",
    #           "--appset-path", "apps/applications.yaml",
    #           "--appset-interval", "1m"]

    # Mode 3 — something else keeps the app set current on a volume: a git-sync
    # sidecar, or the Flux source-controller pattern. That writer must publish
    # atomically (write a temporary file, rename it over the target); a file
    # rewritten in place can be read half-written, which the controller refuses
    # and keeps its last-good set for, but a truncation that is still valid YAML
    # cannot be told from a set you meant to shrink.
    # command: ["controller", "--appset-dir", "/var/lib/swarmcli-cd/appset"]

    # Prune — add to any of the three. Without it an application removed from
    # the app set stops being reconciled and its stack is left running, reported
    # as orphaned. With it the stack is deleted, so removing an entry to park
    # something is an outage rather than a pause. --prune-volumes extends that
    # to named volumes, which is the one part no reconcile can put back. Added
    # to mode 1, the whole command reads:
    # command: ["controller", "--config", "/etc/swarmcli-cd/applications.yaml",
    #           "--prune", "--prune-volumes"]

    # TLS — serve the API over https instead of plaintext, which is what makes
    # publishing the port at all defensible. Create the pair as secrets first:
    #   docker secret create swarmcli-cd-tls-cert ./tls.crt
    #   docker secret create swarmcli-cd-tls-key ./tls.key
    # Both flags or neither: one alone is refused, because what it would
    # otherwise produce is a listener serving plaintext while you believe it is
    # encrypted. The pair is read once at startup, so a renewed certificate
    # needs a redeploy.
    #
    # Turning it on WITHOUT the two SWARMCLI_CD_ variables under `environment:`
    # below breaks this service: the healthcheck probes http://127.0.0.1:8080 by
    # default, a TLS listener refuses that, and Swarm restarts a task whose
    # controller is working perfectly — with nothing in the logs saying TLS.
    # Uncomment all four commented TLS blocks together: this command, the two
    # environment variables, the two entries in `secrets:` and the two in the
    # top-level `secrets:` block.
    # command: ["controller", "--config", "/etc/swarmcli-cd/applications.yaml",
    #           "--tls-cert", "/run/secrets/swarmcli-cd-tls-cert",
    #           "--tls-key", "/run/secrets/swarmcli-cd-tls-key"]

    healthcheck:
      # The image carries no curl and needs none: the binary probes itself.
      test: ["CMD", "/swarmcli-cd", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      replicas: 1
      placement:
        # Per D2 the controller talks to the swarm's own API, which only a
        # manager serves. A worker would fail every apply.
        constraints: [node.role == manager]
      restart_policy:
        condition: any

    volumes:
      # :ro applies to the socket file, not to the API reached through it —
      # this controller creates and updates services, and must. It only stops
      # the file itself being replaced.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Repository clones and the chart cache. On a volume because a restart
      # would otherwise re-clone every application from scratch.
      - swarmcli-cd-data:/var/lib/swarmcli-cd

    environment:
      # A file, not the token itself: a Docker secret is encrypted at rest in
      # the raft log and delivered in memory, and never appears in
      # `docker service inspect`.
      SWARMCLI_CD_ADMIN_TOKEN_FILE: /run/secrets/swarmcli-cd-token
      # With TLS on (see the command above), both of these, together. They are
      # read by every command this binary runs inside the container — the
      # healthcheck above, and a `docker exec ... /swarmcli-cd app list`.
      #
      # SERVER moves the healthcheck to https, which is the whole of keeping
      # this task healthy; it needs no certificate, because the probe skips
      # verification for a loopback https URL only — /healthz discloses nothing,
      # the connection never leaves the host, and it is asserting liveness
      # rather than identity. CA_CERT is for `app` and `status`, which do
      # verify: it names the certificate itself, which works because a
      # self-signed leaf is its own authority. Without it, every CLI call inside
      # the container fails on an untrusted certificate.
      # SWARMCLI_CD_SERVER: https://127.0.0.1:8080
      # SWARMCLI_CD_CA_CERT: /run/secrets/swarmcli-cd-tls-cert
      # For a private repository, uncomment the two lines below — and with them
      # the two swarmcli-cd-git-token entries further down, in the service's
      # `secrets:` list and in the top-level block. TOKEN_FILE only says where
      # the controller expects the file; mounting the secret is what puts one
      # there, and given the path alone the controller exits before the listener
      # binds, which from the outside looks exactly like a bad token. The
      # username is often ignored by the forge, but GitHub wants a non-empty one.
      # SWARMCLI_CD_GIT_USERNAME: x-access-token
      # SWARMCLI_CD_GIT_TOKEN_FILE: /run/secrets/swarmcli-cd-git-token
      #
      # Private image registries are per application, not here: an application's
      # `registryAuth:` in applications.yaml names a Docker secret holding a
      # docker config.json, and that secret is mounted into this controller
      # under `secrets:` below. One application uses only the secret it names,
      # so it cannot pull another's private images. Create it from a login:
      #   docker --config /tmp/rc login ghcr.io -u <user> -p <pat>
      #   docker secret create swarmcli-cd-regauth-edge /tmp/rc/config.json
      # Static credentials only: the image ships no credential helpers, so a
      # config.json using credsStore/credHelpers is refused at startup, and
      # short-lived ECR/GCR tokens must be refreshed out of band.

    # The API — and the web UI on the same port — is deliberately not published
    # here. The reason is the token rather than the UI: this port carries
    # root-equivalent access to the swarm behind one shared bearer credential,
    # so publishing it over plaintext HTTP on a node with a public address puts
    # the swarm on the internet. The token is on the wire in every request, and
    # a browser would be typing it into a page anybody on the path could have
    # rewritten first. Reach it from inside the swarm, or over an SSH tunnel,
    # which is also how you open the UI in a browser:
    #
    #   ssh -L 8080:127.0.0.1:8080 manager
    #
    # Publishing it is defensible with three things together, and none of the
    # three is optional:
    #
    #   1. TLS on — uncomment the four TLS blocks above, or put a reverse proxy
    #      in front of this service to terminate it. Without this the other two
    #      buy nothing.
    #   2. The token as a Docker secret, which is what it already is above.
    #      Never SWARMCLI_CD_ADMIN_TOKEN with the value in it: that is in
    #      `docker service inspect` output for anyone who can reach the daemon.
    #   3. The port reachable only from where your operators are. Swarm's
    #      routing mesh publishes it on EVERY node's address, not just this
    #      manager's, so "the managers are private" is not the control you may
    #      think it is — use a firewall, or `mode: host` with a placement
    #      constraint. There is one credential, it never rotates on its own, and
    #      nothing throttles attempts against it: 32 random bytes from the
    #      command at the top of this file survive that, and a token somebody
    #      chose by hand does not.
    #
    # See docs/web-ui.md and docs/configuration.md#tls.
    # ports:
    #   - "8080:8080"

    # Mode 1 only. In git and path mode the app set does not come from a config,
    # and leaving this mounted would leave a stale copy of it on disk.
    configs:
      - source: swarmcli-cd-applications
        target: /etc/swarmcli-cd/applications.yaml
    secrets:
      - swarmcli-cd-token
      # The git credential, for a private repository. Create it first:
      #   printf '%s' "$YOUR_GIT_TOKEN" | docker secret create swarmcli-cd-git-token -
      # - swarmcli-cd-git-token
      # The TLS pair, for the --tls-cert/--tls-key command above.
      # - swarmcli-cd-tls-cert
      # - swarmcli-cd-tls-key
      # One per application that pulls from a private registry. The name must
      # match that application's `registryAuth:`, and the default mount path
      # /run/secrets/<name> is where the controller reads it.
      # - swarmcli-cd-regauth-edge

configs:
  swarmcli-cd-applications:
    external: true

secrets:
  swarmcli-cd-token:
    external: true
  # swarmcli-cd-git-token:
  #   external: true
  # swarmcli-cd-tls-cert:
  #   external: true
  # swarmcli-cd-tls-key:
  #   external: true
  # swarmcli-cd-regauth-edge:
  #   external: true

volumes:
  swarmcli-cd-data:
