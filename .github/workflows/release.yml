name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update_release_draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # v7.6.0 resolves a tag ref to its commit SHA, so the draft no longer
      # asks GitHub to target refs/tags/<tag> ("not supported as release
      # target, falling back to default branch").
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          config-name: release_template.yml
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: update_release_draft
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # .goreleaser.yml's before.hooks build the UI bundle that //go:embed
      # compiles in, and this runner has no Node otherwise. Missing, the hooks
      # fail loudly and no release is published — which is the good outcome. The
      # bad one is this step and those hooks both being forgotten: four binaries
      # ship, every check passes, and only a browser ever sees that they serve
      # web.notBuilt. Node 26 matches ci.yml's ui job and the Dockerfile's ui
      # stage, so the release builds the bundle CI tested.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      # The chart engine's version is the swarmcli release go.mod pins, which is
      # not this binary's tag. Reading it here rather than hard-coding it is what
      # keeps the stamp from drifting away from what is actually compiled in.
      # Both the version and the package it is stamped into, because the package
      # path carries the major from v2 on. Hard-coding it makes a CE major bump
      # a silently unstamped release: the linker drops a -X whose symbol does
      # not resolve without a word, and charts.EngineVersion() then returns
      # empty, which reads as "unknown" at every swarmcliVersion floor.
      - name: Read the pinned chart-engine module and version
        run: |
          ce=$(awk '{for (i = 1; i <= NF; i++) if ($i ~ /^github\.com\/Eldara-Tech\/swarmcli(\/v[0-9]+)?$/) {print $i; exit}}' go.mod)
          if [ -z "$ce" ]; then
            echo "::error::no github.com/Eldara-Tech/swarmcli[/vN] require in go.mod"
            exit 1
          fi
          # Prove the package the -X names actually exists before goreleaser
          # builds. This is the only gate on the published binaries: the image
          # has "The binary reports both versions" in ci.yml, but goreleaser
          # builds and publishes in one invocation, so a check after it is not
          # a gate, and cross-compiled artefacts cannot be run on this runner
          # to be asked.
          if ! go list "$ce/charts" >/dev/null 2>&1; then
            echo "::error::$ce/charts is not in the build graph; the engine-version -X would be dropped silently"
            exit 1
          fi
          echo "ENGINE_PKG=$ce" >> "$GITHUB_ENV"
          echo "ENGINE_VERSION=$(go list -m -f '{{.Version}}' "$ce")" >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Force goreleaser to use the pushed tag rather than `git describe`,
          # which is non-deterministic when two tags (e.g. v1.1.0-rc1 and
          # v1.1.0) point at the same commit. Without this, promoting an RC to
          # GA at the same commit fails because goreleaser tries to re-publish
          # the RC. The docker job does the equivalent via metadata-action's
          # semver parser.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  docker:
    needs: update_release_draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Multi-arch: a swarm of Raspberry Pis or Graviton nodes is a perfectly
      # ordinary place to run this, and the controller has to be schedulable on
      # a manager whatever that manager is.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: eldaratech/swarmcli-cd
          # -oss, and no moving tag at all (D21).
          #
          # Under D20 the unsuffixed tags and :latest belong to the merged
          # artefact, which is built from the private wrapper and pushed to this
          # same repository on Docker Hub. Two pipelines writing
          # eldaratech/swarmcli-cd:1.2.0 would leave an operator with whichever
          # finished last, and stack.yml pulls :latest.
          #
          # latest=false rather than latest=auto: this build must never become
          # what stack.yml pulls by default, and the consequence — a public tag
          # on its own no longer moves :latest — is stated in RELEASING.md
          # rather than discovered.
          #
          # No :oss either. An Apache-2.0-only deployment pins a version, which
          # is what an air-gapped or compliance-reviewed one does anyway, and a
          # moving tag on the artefact whose whole point is being verifiable is
          # a way to be surprised by what is running.
          flavor: |
            latest=false
            suffix=-oss
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
