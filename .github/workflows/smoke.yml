name: Browser smoke

# The browser run, in its own workflow (D19).
#
# It is the only thing in this repository that exercises the UI the way an
# operator does: a real controller, a real single-node swarm, a real admin token
# and a real event stream. Everything below a browser — the Vitest suite, the Go
# handlers — passes whether or not the CSP, the bearer header on a streamed
# request and the SSE parser actually work together.
#
# Separate from ci.yml so that its flakiness never gates the Go suite. A red
# smoke is a reason to look; it is not a reason for a doc PR to sit blocked.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gate on a paths-filter OUTPUT, not a workflow-level path filter: a
  # path-filtered workflow never starts, so a required check would stay pending
  # for ever and a doc-only PR would deadlock.
  changes:
    runs-on: ubuntu-latest
    outputs:
      smoke: ${{ steps.f.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            smoke:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'web/**'
              - '.github/workflows/smoke.yml'

  smoke:
    needs: [changes]
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SWARMCLI_CD_ADMIN_TOKEN: smoke-run-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Directly on the runner's Docker rather than nested in DinD, as the
      # integration tests do: the OSS build resolves exactly one swarm, the one
      # it runs in, and a nested swarm shadows the real topology.
      - name: Initialise a single-node swarm
        run: docker swarm init --advertise-addr 127.0.0.1

      # So that the first reconcile is not racing a cold pull, which is what
      # would otherwise decide whether the event arrives inside the timeout.
      - name: Pre-pull the fixture image
        run: docker pull busybox:1.36

      - name: Install
        run: npm --prefix web/ui ci

      # The binary the browser talks to has the bundle embedded in it, which is
      # the only configuration this test is about. A Vite dev server proxying to
      # a controller would prove neither the embed nor the headers web.go sends.
      - name: Build the UI into the binary
        run: |
          npm --prefix web/ui run build
          go build -o swarmcli-cd ./cmd/swarmcli-cd

      # A local repository, cloned over a file path exactly as the integration
      # tests do it. The chart is a busybox that sleeps: the smallest thing that
      # reliably reaches running on any runner, with no healthcheck and a tag
      # that is always pullable.
      - name: Build the fixture repository
        run: |
          mkdir -p smoke-repo/charts/app/templates
          cd smoke-repo
          cat > swarmcli-release.yaml <<'YAML'
          apiVersion: v1
          releases:
            - name: smoke
              chart: ./charts/app
          YAML
          printf 'apiVersion: v1\nname: app\nversion: 0.1.0\n' > charts/app/Chart.yaml
          cat > charts/app/templates/stack.yaml <<'YAML'
          version: "3.9"
          services:
            app:
              image: busybox:1.36
              command: ["sleep", "3600"]
              deploy:
                replicas: 1
          YAML
          git init -q -b main
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m chart

      - name: Start the controller
        run: |
          cat > applications.yaml <<YAML
          applications:
            - name: smoke
              source:
                repoURL: $PWD/smoke-repo
                revision: main
                releaseFile: swarmcli-release.yaml
              syncPolicy:
                automated: true
                interval: 10s
              driftDetection: manifest
          YAML
          ./swarmcli-cd controller --config applications.yaml --data ./smoke-data > controller.log 2>&1 &
          echo $! > controller.pid
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "the controller never became reachable"
          cat controller.log
          exit 1

      - name: Install the browser
        working-directory: web/ui
        run: npx playwright install --with-deps chromium

      - name: Run the smoke
        working-directory: web/ui
        run: npm run smoke

      # The controller's own account of the reconcile, which is the first thing
      # anybody wants when the event never arrived.
      - name: The controller log
        if: always()
        run: cat controller.log || true

      - name: Stop the controller
        if: always()
        run: kill "$(cat controller.pid)" || true
