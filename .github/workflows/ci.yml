name: SwarmCLI CD CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which file groups changed; downstream jobs gate on these outputs.
  # Filtering at the job level (not the workflow trigger) means skipped jobs
  # still publish a "skipped" status that satisfies branch-protection required
  # checks — a paths-filtered workflow never runs, so a required check would
  # stay pending forever and doc-only PRs would deadlock.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
      image: ${{ steps.f.outputs.image }}
      ui: ${{ steps.f.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: f
        with:
          filters: |
            code:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            image:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              # The image is where the two halves are proved to compose, so a
              # UI-only change must not skip the only job that builds both.
              - 'web/**'
              - '.github/workflows/ci.yml'
            ui:
              - 'web/**'
              - '.github/workflows/ci.yml'
              # The three files that decide how the shipped bundle is built,
              # and none of which is under web/. The `ui` job is the only place
              # the CSP is asserted against a real bundle, so a change to the
              # builder that never runs it is the assertion going quiet on
              # exactly the change most likely to break it. Node's own version
              # is the other half of that and is check-node-pins.sh's, below.
              - 'Dockerfile'
              - '.github/workflows/release.yml'
              - '.goreleaser.yml'

  fmt:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go fmt
        run: |
          gofmt -w .
          git diff --exit-code

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
      - name: Run lint
        run: golangci-lint run ./...

  vet:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...
      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code || (echo "Run go mod tidy locally" && exit 1)

  test:
    needs: [changes, fmt, lint, vet]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run unit tests
        run: go test -race -count=1 -timeout 5m ./...
      - name: Build
        run: go build -v -o swarmcli-cd ./cmd/swarmcli-cd

  # The only job that has a real bundle, and so the only one that can run the
  # tests needing one: TestTheBuiltIndexHasNoInlineScriptOrStyle greps the
  # embedded index and skips wherever nothing was built, which in the `test` job
  # is always — it has no Node. Without Go here, the CSP is asserted nowhere.
  ui:
    needs: [changes]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install
        run: npm --prefix web/ui ci

      - name: Lint
        run: npm --prefix web/ui run lint

      - name: Typecheck
        run: npm --prefix web/ui run typecheck

      # Where the generated wire fixtures are checked against the TypeScript
      # that reads them; see application/fixtures_test.go. tsc has already run
      # above, which is the half of that check the compiler does.
      - name: Test
        run: npm --prefix web/ui run test

      - name: Build
        run: npm --prefix web/ui run build

      # emptyOutDir wipes web/dist on every build, and a Vite plugin puts the
      # sentinel back. If that ever stops working the failure lands somewhere
      # else entirely: every `go build` on a machine with no Node stops
      # compiling, on somebody else's PR.
      - name: The embed sentinel survived the build
        run: |
          test -f web/dist/.gitkeep || {
            echo "web/dist/.gitkeep is gone; keepSentinel in vite.config.ts is what restores it"
            exit 1
          }

      # ./web and not ./web/... : this is the one job with node_modules on disk,
      # and a dependency tree contains Go packages of its own — eslint's
      # `flatted` ships one — which the recursive form would compile as part of
      # this repository.
      #
      # The variable is what makes this the one place the CSP assertion cannot
      # skip. Everywhere else there is no bundle and skipping is correct; here
      # a skip means the build above produced nothing and the assertion passed
      # by not running, which is indistinguishable from passing.
      - name: The UI tests, against a real bundle
        env:
          SWARMCLI_CD_REQUIRE_UI_BUNDLE: '1'
        run: go test -count=1 ./web

  # No paths filter, deliberately, and the only job here without one. What it
  # reads is where a Node version is pinned, and a filter would be a second copy
  # of that list — kept by hand, in the file whose job is to notice when the
  # first one moved. It is two seds and needs no toolchain.
  node-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every Node pin is the same Node
        run: ./scripts/check-node-pins.sh

  # Builds the image and proves the container runs with no docker binary in it,
  # which is what makes the moby-client backend worth having. It does not push:
  # publishing happens on a tag, in release.yml.
  image:
    needs: [changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: swarmcli-cd:ci
          build-args: |
            VERSION=ci

      - name: The binary reports both versions
        run: |
          out=$(docker run --rm swarmcli-cd:ci version)
          echo "$out"
          # An unstamped engine would report "unstamped" here and every chart
          # compatibility check would silently be Unknown.
          echo "$out" | grep -q 'chart engine v' || {
            echo "the chart engine version was not stamped into the image"; exit 1; }

      - name: The image carries no docker binary
        run: |
          if docker run --rm --entrypoint sh swarmcli-cd:ci -c 'command -v docker'; then
            echo "a docker binary is present; the applier does not need one"; exit 1
          fi

      # The refusal an operator is most likely to meet, and the one that would
      # otherwise present as an API that rejects every request.
      - name: The controller refuses to start with no admin token
        run: |
          printf 'applications:\n  - name: edge\n    source:\n      repoURL: https://example.com/x.git\n      revision: main\n      releaseFile: r.yaml\n' > applications.yaml
          out=$(docker run --rm -v "$PWD/applications.yaml:/etc/swarmcli-cd/applications.yaml:ro" swarmcli-cd:ci 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'no admin token configured' || {
            echo "expected it to refuse to start"; exit 1; }

      # The criterion issue #171 exists for, asserted where it actually bites:
      # Docker running the health command inside the container with the
      # container's own environment, which is the mechanism the whole resolution
      # rests on and the one nothing below the image can exercise. stack.yml's
      # healthcheck probes http://127.0.0.1:8080 unless the environment says
      # otherwise; a TLS listener refuses that, and Swarm then restarts a task
      # whose controller is working perfectly, with nothing in the logs saying
      # TLS.
      #
      # The negative control is what makes this a test rather than a ritual:
      # without SWARMCLI_CD_SERVER the same image must go *unhealthy*. Without
      # it, "healthy" cannot be told apart from a probe that always passes.
      - name: The container healthcheck stays healthy with TLS on
        run: |
          printf 'applications:\n  - name: edge\n    source:\n      repoURL: https://example.com/x.git\n      revision: main\n      releaseFile: r.yaml\n' > applications.yaml
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 \
            -subj '/CN=localhost' \
            -addext 'subjectAltName=IP:127.0.0.1,DNS:localhost' \
            -keyout tls.key -out tls.crt 2>/dev/null

          start() {
            docker run -d "$@" \
              -v "$PWD/applications.yaml:/etc/swarmcli-cd/applications.yaml:ro" \
              -v "$PWD/tls.crt:/tls/tls.crt:ro" \
              -v "$PWD/tls.key:/tls/tls.key:ro" \
              -e SWARMCLI_CD_ADMIN_TOKEN=ci-token \
              --health-cmd '/swarmcli-cd healthcheck' \
              --health-interval 3s --health-retries 3 --health-start-period 1s \
              swarmcli-cd:ci controller \
                --config /etc/swarmcli-cd/applications.yaml \
                --tls-cert /tls/tls.crt --tls-key /tls/tls.key
          }

          # Waits for Docker to reach a verdict, then waits three more intervals
          # before reading it: a probe that passed once and then stopped would
          # restart the task just the same, and would satisfy a single read.
          settle() {
            for _ in $(seq 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$1")" = starting ] || break
              sleep 1
            done
            sleep 10
            docker inspect -f '{{.State.Health.Status}}' "$1"
          }

          tls=$(start -e SWARMCLI_CD_SERVER=https://127.0.0.1:8080)
          control=$(start)
          trap 'docker rm -f "$tls" "$control" >/dev/null 2>&1 || true' EXIT

          got=$(settle "$tls")
          echo "with SWARMCLI_CD_SERVER: $got"
          [ "$got" = healthy ] || {
            docker logs "$tls"
            echo "the healthcheck did not stay healthy with TLS on"; exit 1; }

          got=$(settle "$control")
          echo "negative control, no SWARMCLI_CD_SERVER: $got"
          [ "$got" = unhealthy ] || {
            echo "the control is $got; the probe is not really being run"; exit 1; }
