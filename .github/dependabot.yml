version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The CE pin is chosen deliberately in a release PR — the build stamps
      # charts.engineVersion from it (see RELEASING.md), so it must not move on
      # a weekly schedule.
      - dependency-name: "github.com/Eldara-Tech/swarmcli"
      # Pinned to v28.5.1 — at v29 its cli/compose/convert moved to
      # github.com/moby/moby's API types, which are distinct Go types from the
      # github.com/docker/docker ones the applier uses.
      - dependency-name: "github.com/docker/cli"
    labels:
      - B0-low-priority
      - C0-breaks-nothing
      - D0-dependency

  # The UI's tree. Grouped like the Go one, so a week's patch bumps are one PR
  # and a major arrives on its own — a React or Vite major is a change to review,
  # not to merge on green. deps.yml re-runs the licence allowlist on every one of
  # these, which is the point: what breaches it is a transitive dependency that
  # appears in the lockfile diff and nowhere else.
  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels:
      - B0-low-priority
      - C0-breaks-nothing
      - D0-dependency

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels:
      - B0-low-priority
      - C0-breaks-nothing
      - D0-dependency

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker-images:
        patterns: ["*"]
    labels:
      - B0-low-priority
      - C0-breaks-nothing
      - D0-dependency
