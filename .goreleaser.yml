version: 2

project_name: swarmcli-cd

before:
  hooks:
    - go mod download
    - go mod verify
    # Vite writes web/dist, which //go:embed reads while compiling — so the
    # bundle has to exist before the first of the four builds starts. Hooks run
    # once, so all four embed the same bytes.
    #
    # `go build` alone does not do this and does not complain: web/dist holds a
    # committed sentinel, so a release built without these two hooks succeeds,
    # publishes four correctly-sized binaries, serves the API normally, and
    # answers every browser with web.notBuilt. Nothing fails.
    #
    # --ignore-scripts because this hook runs in the release job, whose
    # environment carries GITHUB_TOKEN with contents: write. web/ui/.npmrc says
    # the same thing for an invocation nobody flagged; both, because which
    # .npmrc npm treats as the project's is decided from the working directory
    # and this runs from the repository root.
    - npm --prefix web/ui ci --ignore-scripts
    - npm --prefix web/ui run build

release:
  prerelease: auto
  draft: false
  use_existing_draft: true

env:
  - CGO_ENABLED=0

builds:
  - id: swarmcli-cd
    binary: swarmcli-cd
    main: ./cmd/swarmcli-cd
    goos:
      # linux for the controller, which runs in the swarm; darwin because the
      # same binary is the client, and `swarmcli-cd app list` is run from a
      # laptop far more often than the controller is started by hand.
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Eldara-Tech/swarmcli-cd/controller.version={{.Version}}
      # The chart engine is the swarmcli release this module pins, not this
      # binary's tag. ENGINE_VERSION is computed from go.mod by the workflow;
      # without it charts.EngineVersion() is empty and every chart's declared
      # floor goes unchecked.
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Env.ENGINE_VERSION}}
    hooks:
      # On each of the four binaries actually being published, rather than on a
      # stand-in built somewhere else. What it asserts is what the -oss name
      # claims: the main module is this repository and nothing private is linked
      # (D21). ci.yml runs the same script on every change, so it is not a gate
      # that only ever fires on a tag.
      post:
        - ./scripts/check-oss-artefact.sh "{{ .Path }}"

archives:
  # `_oss` at the end, not `swarmcli-cd-oss` at the front (D21). Under D20 the
  # plain name belongs to the merged artefact, which is built from the private
  # wrapper and published into this repository's releases — so both pipelines
  # write into the same GitHub release, and leaving the plain name here would
  # have them overwrite each other's archives with whichever finished last.
  #
  # Where the qualifier sits decides what a release page shows first. GitHub
  # renders assets sorted by lower(name) in codepoint order — upload order and
  # which pipeline finished last do not enter into it — so a `swarmcli-cd-oss_`
  # prefix put every Apache-2.0 archive above every merged one (`-` is 0x2D, `_`
  # is 0x5F). As a suffix, `.` (0x2E) precedes `_` (0x5F), so each merged
  # archive sorts immediately above its own oss twin and the first artefact row
  # is the default build. Same change as Eldara-Tech/swarmcli#569, and verified
  # the same way: probe assets uploaded in the opposite order still list
  # `probe_Linux_x86_64.tar.gz` before `probe_Linux_x86_64_oss.tar.gz`.
  #
  # The binary *inside* is still `swarmcli-cd`. It is the same command: renaming
  # it would make every documented invocation, stack.yml's entrypoint and the
  # container healthcheck differ between the two builds. What tells them apart
  # is what the build says about itself — see docs/editions.md.
  - id: oss
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}_oss
    files:
      - LICENSE*
      - README.md
      - stack.yml

# For the same reason, one word longer. A release carries two checksum files
# because it carries two sets of artefacts, and a single `checksums.txt` would
# be the one file in which the two pipelines silently disagree — the second run
# to finish replacing the first's manifest, leaving half the release unverified
# by the file that claims to cover it. The merged pipeline writes
# `checksums-merged.txt`; neither side takes the unqualified name, so no
# checksum file in a release is ambiguous about which artefacts it verified.
checksum:
  name_template: 'checksums-oss.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
