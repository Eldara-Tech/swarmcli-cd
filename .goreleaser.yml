version: 2

project_name: swarmcli-cd

before:
  hooks:
    - go mod download
    - go mod verify
    # Vite writes web/dist, which //go:embed reads while compiling — so the
    # bundle has to exist before the first of the four builds starts. Hooks run
    # once, so all four embed the same bytes.
    #
    # `go build` alone does not do this and does not complain: web/dist holds a
    # committed sentinel, so a release built without these two hooks succeeds,
    # publishes four correctly-sized binaries, serves the API normally, and
    # answers every browser with web.notBuilt. Nothing fails.
    #
    # --ignore-scripts because this hook runs in the release job, whose
    # environment carries GITHUB_TOKEN with contents: write. web/ui/.npmrc says
    # the same thing for an invocation nobody flagged; both, because which
    # .npmrc npm treats as the project's is decided from the working directory
    # and this runs from the repository root.
    - npm --prefix web/ui ci --ignore-scripts
    - npm --prefix web/ui run build

release:
  prerelease: auto
  draft: false
  use_existing_draft: true

env:
  - CGO_ENABLED=0

builds:
  - id: swarmcli-cd
    binary: swarmcli-cd
    main: ./cmd/swarmcli-cd
    goos:
      # linux for the controller, which runs in the swarm; darwin because the
      # same binary is the client, and `swarmcli-cd app list` is run from a
      # laptop far more often than the controller is started by hand.
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Eldara-Tech/swarmcli-cd/controller.version={{.Version}}
      # The chart engine is the swarmcli release this module pins, not this
      # binary's tag. ENGINE_VERSION is computed from go.mod by the workflow;
      # without it charts.EngineVersion() is empty and every chart's declared
      # floor goes unchecked.
      - -X github.com/Eldara-Tech/swarmcli/charts.engineVersion={{.Env.ENGINE_VERSION}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE*
      - README.md
      - stack.yml

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
